<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Realms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b1320;
        color: #f5e9c8;
        font-family: "Fredoka", "Segoe UI", system-ui, -apple-system, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        cursor: none;
        image-rendering: pixelated;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 100;
        background: radial-gradient(ellipse at center, #1a2942 0%, #0b1320 100%);
      }
      #loading h1 {
        font-size: 56px;
        margin: 0;
        color: #f5e9c8;
        text-shadow: 0 4px 0 #2a1a0a, 0 6px 12px rgba(0,0,0,.6);
        letter-spacing: 2px;
      }
      #loading .sub { color: #c2a76a; letter-spacing: 1px; }
      #loading .bar {
        width: 360px; height: 14px; border-radius: 8px;
        background: #1c2840; overflow: hidden;
        border: 2px solid #3a2a14;
      }
      #loading .fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #c8932b, #f5cf5a);
        transition: width .15s ease;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">
      <h1>TINY REALMS</h1>
      <div class="sub">forging the kingdom...</div>
      <div class="bar"><div class="fill" id="loading-fill"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
